
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Diri</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #cd6161;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .profile {
            background-color: pink;
            width: 750px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .profile img {
            width: 280px;
            height: 500px;
            border-radius: 10px;
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
        }

        h1 {
            color: hotpink;
        }

        h3 {
            color: hotpink;
            margin-bottom: 5px;
        }

        p {
            color: hotpink;
        }

        ul {
            list-style: circle;
            padding-left: 20px;
        }

        li {
            background-color: hotpink;
            color: white;
            margin: 5px 0;
            padding: 8px;
            border-radius: 8px;
        }

    </style>
</head>

<body>

    <div class="profile">
        <img src="juan1.jpg" alt="Foto Juan">

        <div class="profile-info">
            <h1>Juan Edgar Gunawan</h1>
            <p>Mahasiswa Informatika</p>

            <h3>Hobi</h3>
            <p>Gaming, Coding, dan Mendengarkan Musik</p>

            <h3>Keahlian</h3>
            <ul>
                <li>Java</li>
                <li>HTML & CSS</li>
                <li>JavaScript</li>
                <li>MySQL</li>
            </ul>
        </div>
    </div>

</body>
</html>
