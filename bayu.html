<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: azure;

        }
        #content{
            display: flex;

        }
        
        #desc{
            *{

        table{
            border: 3px solid black;

            th{
                border: 1px solid black;
                padding: 5px;
                background-color: pink;
            }

            td{
                border: 1px solid black;

            }
            tr{

            }
        }

        #picture{
            padding:10px;
            background-color:bisque;
            box-shadow: 3px 3px 3px;
            height: 30vh;
        }

        #target{
            display: flex;
            background-color: purple;
            width: 10vw;
            height: 10vh;
            color: yellow;
            justify-content: center;
            align-items: center;
            position:relative;
            border-style:double;
            border-radius: 10px;
        }

        #name{
            margin: 0px;
            padding: 0px;
            font-size: larger;
            color: goldenrod;
            font-style: italic;
            text-shadow: 1px 1px red;
            font-weight: 900;
        }

            padding: 0px;
            font-size: larger;
            color: blueviolet;
            font-style: italic;
            text-shadow: 1px 1px violet;

        }

        #header{

            display: flex;

        }
        h1{
            margin: 0px;
            height:10vh;
            align-items: center;
            align-self: center;
            align-content: center;
        }

        #game-container{
            margin: 5vh;
            background-color: violet;
            width: 30vw;
            height: 30vh;
            border-style: dashed;
        }
    </style>

    <script src="bayuScript.js" defer></script>
</head>
